name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following files are not gofmt -s formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Scan TODO.md and MEMO.md
        run: |
          for file in TODO.md MEMO.md; do
            if [ ! -f "$file" ]; then
              continue
            fi
            unresolved="$(rg -n '^\\s*- \\[ \\]' "$file" || true)"
            if [ -n "$unresolved" ]; then
              echo "::warning file=$file::unresolved checklist items found"
              echo "$unresolved" | sed -e "s/^/$file:/"
            fi
          done

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run build
        run: go build ./...
